    addons-win-mac:
        name: Build OCP addons (${{ matrix.ocp-variant }}) for ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ["windows-2022"]
                python-version: ["3.12"]
                ocp-variant: ["novtk", "vtk"]
                include:
                    - os: "windows-2022"
                      shells: "bash cmd.exe"
        steps:
            - uses: actions/checkout@v4

            - name: Extract version from pyproject.toml
              id: get_version
              uses: SebRollen/toml-action@v1.2.0
              with:
                  file: "pyproject.toml"
                  field: "project.version"

            - name: Build SDKs
              id: build-ocp-addons
              uses: ./.github/actions/build-wheel
              with:
                  os: ${{ matrix.os }}
                  python-version: ${{ matrix.python-version }}
                  shells: ${{ matrix.shells }}
                  wheel-version: ${{ steps.get_version.outputs.value }}
                  ocp-variant: ${{ matrix.ocp-variant }}
                  ocp-version: ${{ env.OCP_VERSION }}

    tests:
        name: Test OCP Addons for ${{ matrix.python-version }} on ${{ matrix.os }} with ${{ matrix.ocp-package }}
        runs-on: ${{ matrix.runner }}
        needs: [addons-win-mac]

        strategy:
            fail-fast: false
            matrix:
                os: ["windows-2022"]
                python-version: ["3.12"]
                ocp-package: ["cadquery_ocp_novtk", "cadquery_ocp"]
                include:
                    - os: "windows-2022"
                      runner: windows-2022
                    - ocp-package: "cadquery_ocp_novtk"
                      ocp-variant: "novtk"
                    - ocp-package: "cadquery_ocp"
                      ocp-variant: "vtk"

        steps:
            - uses: actions/checkout@v4

            - name: Extract version from pyproject.toml
              id: get_version
              uses: SebRollen/toml-action@v1.2.0
              with:
                  file: "pyproject.toml"
                  field: "project.version"

            - name: Test OCP addons
              id: test-ocp-addons
              uses: ./.github/actions/test-wheel
              with:
                  os: ${{ matrix.os }}
                  python-version: ${{ matrix.python-version }}
                  wheel-version: ${{ steps.get_version.outputs.value }}
                  ocp-package: ${{ matrix.ocp-package }}
                  ocp-version: ${{ env.OCP_VERSION }}
                  ocp-variant: ${{ matrix.ocp-variant }}


name: "Test OCP addons"
description: "Testing OCP addons wheels"
inputs:
  os:
    description: "Operating system to use for the build"
    required: true
  python-version:
    description: "Python version to use for the build"
    required: true
  wheel-version:
    description: "Version of the wheel to build"
    required: true
  ocp-package:
    description: "OCP package to test with (cadquery_ocp_novtk or cadquery_ocp)"
    required: true
  ocp-version:
    description: "OCP package version to install"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    # - - -

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: false
        activate-environment: true

    # - - -

    - name: Download ocp-addons wheel
      uses: actions/download-artifact@v4
      with:
        name: ocp-addons-${{ inputs.wheel-version }}-wheel-${{ inputs.os }}-cp${{ inputs.python-version }}

    # - - -

    - name: Install OCP package and ocp-addons wheel
      shell: bash -l {0}
      run: |
        # Install OCP package (${{ inputs.ocp-package }}) and ocp-addons wheel

        uv pip install ${{ inputs.ocp-package }}==${{ inputs.ocp-version }}
        uv pip install ocp_addons-*.whl
        uv pip install pytest

        uv pip list

        uv run python -c "import OCP; print('Success: OCP', OCP.__version__)"
        uv run python -c "import ocp_addons; print('Success: ocp-addons serializer:', ocp_addons.serializer._test())"

    # - - -

    - name: Run tests
      shell: bash -l {0}
      run: |
        # Run tests

        uv run pytest -v

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocp_addons"
version = "1.1.0rc1"
description = "Addon packages for OCP"
readme = "README.md"
authors = [
    { name = "J Degenstein" },
    { name = "Matthias J" },
    { name = "Bernhard Walter" },
]
dependencies = ["cadquery_ocp_proxy==7.9.3.0"]
requires-python = ">=3.10, <3.15"

[project.urls]
Homepage = "https://github.com/jdegenstein/ocp-addons.git"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
exclude = ["src*", "tests"]
